<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>쿠팡 소싱 수집기</title>
  </head>
  <body>
    <header>
      <h1>쿠팡 소싱 수집기</h1>
      <span class="version">MVP</span>
    </header>

    <section id="detect" class="panel">
      <div class="detect-line">
        <strong id="detect-count">확인 중...</strong>
        <span id="detect-sub" class="sub"></span>
      </div>
      <div id="detect-meta" class="meta"></div>
    </section>

    <button id="collect" type="button" disabled>현재 페이지 수집</button>
    <button id="rescan" type="button" class="ghost">다시 감지</button>

    <section id="review-panel" class="panel hidden">
      <div class="section-title">최근 30일 리뷰 분석</div>
      <p class="meta">
        쿠팡은 최근 1달 리뷰수를 표시하지 않습니다. 리뷰를 <b>최신순</b>으로 정렬한 뒤
        <b>30일보다 오래된 리뷰가 나올 때까지</b> 페이지를 넘기세요.
        넘기는 동안 확장이 자동으로 리뷰를 모읍니다.
      </p>
      <div id="review-progress" class="meta"></div>
      <button id="analyze-reviews" type="button" class="ghost">리뷰 날짜 분석</button>
      <button id="reset-reviews" type="button" class="ghost small-full">누적 초기화</button>
      <div id="review-result" class="meta"></div>
    </section>

    <section id="result" class="panel hidden">
      <div id="result-main"></div>
      <div id="result-sub" class="meta"></div>
    </section>

    <section id="error" class="panel error hidden"></section>

    <footer>
      <label for="api-base">백엔드 주소</label>
      <div class="row">
        <input id="api-base" type="text" spellcheck="false" placeholder="http://localhost:8000" />
        <button id="save-api" type="button" class="ghost small">저장</button>
      </div>
      <p class="note">
        화면에 실제로 보이는 상품만 수집합니다. 예상 판매량은 리뷰수 × 배수이며 실제 판매량이 아닙니다.
      </p>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
