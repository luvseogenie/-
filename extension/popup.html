<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  body { font-family: "Malgun Gothic", sans-serif; font-size: 13px; width: 320px; margin: 0; padding: 14px; color: #1f2933; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  button { display: block; width: 100%; font: inherit; font-size: 14px; padding: 10px; margin: 6px 0; border: 1px solid #cfd4da; border-radius: 8px; background: #fff; cursor: pointer; text-align: left; }
  button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
  button.big { font-weight: 700; }
  button:disabled { opacity: .5; }
  .hint { font-size: 12px; color: #6b7280; margin: 2px 0 8px; }
  .msg { font-size: 12px; margin-top: 8px; min-height: 16px; }
  .ok { color: #059669; } .err { color: #dc2626; }
  .row { display: flex; gap: 6px; align-items: center; }
  input[type=date] { font: inherit; padding: 4px; }
  details { margin-top: 8px; } summary { font-size: 12px; color: #6b7280; cursor: pointer; }
  pre { background: #f3f4f6; padding: 6px; font-size: 11px; max-height: 120px; overflow: auto; white-space: pre-wrap; }
</style></head>
<body>
<h1>쿠팡 광고계산기 <span id="ver" style="font-size:11px;font-weight:400;color:#6b7280"></span></h1>
<div class="hint">쿠팡 화면에서 <b>어제</b> 를 누른 뒤 아래 버튼을 누르세요.</div>
<button class="primary big" id="send-sales">① 판매 데이터 저장<br><span style="font-weight:400;font-size:11px">판매분석 › 어제 화면에서 누르면 '상품별 판매 리포트' 를 받아 저장</span></button>
<button class="primary big" id="send-ads">② 광고 데이터 저장<br><span style="font-weight:400;font-size:11px">광고센터 › 광고 관리 › 매출 성장</span></button>
<button id="open-app">📒 장부 보기 · 옵션/마진 관리</button>
<button id="open-import">📂 리포트 파일 올리기 (직접 받은 엑셀)</button>
<div id="msg" class="msg"></div>
<details><summary>날짜 직접 지정 / 찾은 표 보기</summary>
  <div class="row" style="margin-top:6px"><label>데이터 날짜</label><input type="date" id="date"></div>
  <div class="hint">비워 두면 화면의 날짜를 찾고, 없으면 어제로 저장합니다.</div>
  <pre id="detail"></pre>
</details>
<script type="module" src="popup.js"></script>
</body></html>
